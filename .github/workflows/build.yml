name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Einkauf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Einkauf-apk
          path: Einkauf.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Einkauf 1.${{ github.run_number }}
          files: Einkauf.apk
          make_latest: true
